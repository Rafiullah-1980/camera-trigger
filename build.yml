name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download offline speech model (Vosk small English)
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          mkdir -p camera/src/main/assets
          rm -rf camera/src/main/assets/model
          cp -r app/src/main/assets/model camera/src/main/assets/model

      - name: Build all APKs
        run: gradle assembleDebug --no-daemon

      - name: Upload Voice Trigger Recorder APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTriggerRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Key Generator APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyGenerator-APK
          path: keygen/build/outputs/apk/debug/keygen-debug.apk

      - name: Upload Voice Trigger Camera APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTriggerCamera-APK
          path: camera/build/outputs/apk/debug/camera-debug.apk
